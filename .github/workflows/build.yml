name: 自動砌字卡 PDF

# 幾時跑：
#  1. 有人改咗字卡（.md）或者字形圖，push 上 main
#  2. 喺 GitHub 網頁手動撳掣（workflow_dispatch）
#
# 做完會將砌好嘅 PDF 直接 commit 返入 repo，
# 咁 Private repo 都唔使開 GitHub Pages（Pages 喺 Private repo 要付費版）。
#
# 出兩種 PDF：
#   字卡.pdf      —— 合訂本，所有卡一份
#   pdf/<字>.pdf  —— 每隻字一份，方便單獨睇／打印／send 俾人
on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'img/**'
      - 'fonts/**'
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write        # 要寫返個 PDF 入 repo

concurrency:
  group: build-pdf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 攞 repo 落嚟
        uses: actions/checkout@v4

      - name: 裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 裝 Python 套件
        run: pip install -r requirements.txt

      - name: 裝 Chromium（出 PDF 用）
        run: python -m playwright install --with-deps chromium

      - name: 裝花園明朝（罕見字用）
        # NotoSansTC 係繁體常用字子集，唔覆蓋 CJK 擴展區。
        # 說文引文入面嘅古字（㣇 𩫚 𩫕…）同 IPA 上古音符號（ɢʷɯlʔ）要靠佢。
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-hanazono

      - name: 檢查每隻字都畫得出
        # 字型冇某隻字唔會報錯，只會靜靜哋出豆腐格。呢步喺砌之前先捉。
        run: python check_glyphs.py

      - name: 整 PDF 專用 TrueType 字型
        # Chromium 出 PDF 唔食 CFF/OTF 字型，中文會全部唔見。
        # 呢步將字型轉成 TrueType 再裝落系統。詳情見 make_pdf_font.py。
        run: |
          python make_pdf_font.py
          fc-cache -f ~/.local/share/fonts
          fc-list | grep -iE "TCPdf|ZikaRare"

      - name: 砌 HTML
        run: python build_demo.py

      - name: 砌合訂本 PDF
        run: python build_pdf.py 字卡.pdf

      - name: 砌每隻字一份 PDF
        # 出去 pdf/<字>.pdf。舊嘅字卡刪咗之後，個 PDF 唔會自己消失，
        # 所以先清空成個資料夾再砌返。
        run: |
          rm -rf pdf
          python build_pdf.py --each pdf

      - name: 檢查每份 PDF 真係有中文
        # 如果字型出事，PDF 會照出但中文全部消失。呢步係安全網：
        # 冇中文就當失敗，唔會靜靜哋出一份爛嘢。合訂本同單張都要驗。
        run: python check_pdf.py 字卡.pdf pdf/*.pdf

      - name: 將 PDF commit 返入 repo
        # [skip ci] 係為咗唔好觸發返自己（無限迴圈）。
        # 啲 PDF 唔喺上面 paths 清單度，本身已經唔會觸發，呢個係雙重保險。
        # 用 --all 連「刪咗嘅字卡留低嘅舊 PDF」都一齊記錄低。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f --all 字卡.pdf pdf
          if git diff --staged --quiet; then
            echo "PDF 冇變，唔使 commit"
          else
            git commit -m "自動更新字卡 PDF [skip ci]"
            git push
            echo "PDF 已更新"
          fi

      - name: 另存一份做 artifact
        # 除咗 repo 入面嗰份，Actions 呢度都留一份（90 日）。
        # 萬一 commit 嗰步出事，喺呢度都download 到。
        uses: actions/upload-artifact@v4
        with:
          name: 字卡PDF
          path: |
            字卡.pdf
            pdf/
          retention-days: 90
