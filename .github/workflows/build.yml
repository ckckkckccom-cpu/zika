name: 砌網站同 PDF

# 幾時跑：
#  1. 有人改咗字卡（.md）、字形圖、樣式或者程式，push 上 main
#  2. 喺 GitHub 網頁手動撳掣（workflow_dispatch）
#
# 做兩件事：
#   build  —— 砌網站（site/）同 PDF，檢查，PDF commit 返入 repo
#   deploy —— 將 site/ 發佈去 GitHub Pages
#
# ⚠️ 第一次要喺 Settings → Pages → Source 揀「GitHub Actions」，
#    Actions 自己開唔到。未開之前 deploy 嗰步會紅色，build 照樣成功。
#    詳情見 SETUP.md 第 6 部分。
on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'img/**'
      - 'fonts/**'
      - 'assets/**'
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 要寫返個 PDF 入 repo
    steps:
      - name: 攞 repo 落嚟
        uses: actions/checkout@v4

      - name: 裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 裝 Python 套件
        run: pip install -r requirements.txt

      - name: 裝 Chromium（出 PDF 同檢查網站用）
        run: python -m playwright install --with-deps chromium

      - name: 裝花園明朝（罕見字用）
        # NotoSansTC 係繁體常用字子集，唔覆蓋 CJK 擴展區。
        # 說文引文入面嘅古字（㣇 𩫚 𩫕…）同 IPA 上古音符號（ɢʷɯlʔ）要靠佢。
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-hanazono

      - name: 檢查每隻字都畫得出
        # 字型冇某隻字唔會報錯，只會靜靜哋出豆腐格。呢步喺砌之前先捉。
        run: python check_glyphs.py

      - name: 整 PDF 專用 TrueType 字型
        # Chromium 出 PDF 唔食 CFF/OTF 字型，中文會全部唔見。
        run: |
          python make_pdf_font.py
          fc-cache -f ~/.local/share/fonts
          fc-list | grep -iE "TCPdf|ZikaRare"

      - name: 砌網站
        run: python build_site.py

      - name: 砌合訂本 PDF
        run: python build_pdf.py 字卡.pdf

      - name: 砌每隻字一份 PDF
        # 舊嘅字卡刪咗之後個 PDF 唔會自己消失，所以先清空再砌返。
        run: |
          rm -rf pdf
          python build_pdf.py --each pdf

      - name: 檢查每份 PDF 真係有中文
        # 字型出事嘅話，PDF 會照出但中文全部消失。呢步係安全網。
        run: python check_pdf.py 字卡.pdf pdf/*.pdf

      - name: 再砌一次網站
        # 第一次砌嗰陣，新字卡嘅 PDF 仲未出，所以頁面上冇下載連結。
        # 出完 PDF 再砌多次，連結同 site/pdf/ 就一定對得齊。
        run: python build_site.py

      - name: 用瀏覽器逐頁檢查網站
        # 手機闊度同電腦闊度各行一次：字級、橫向溢出、字型、圖、console 錯。
        run: python check_site.py --shots shots

      - name: 留低截圖（出事嗰陣好用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 網站截圖
          path: shots/
          retention-days: 30

      - name: 打包網站俾 Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 將 PDF commit 返入 repo
        # [skip ci] 係為咗唔好觸發返自己。PDF 本身唔喺上面 paths 清單，
        # 已經唔會觸發，呢個係雙重保險。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f --all 字卡.pdf pdf
          if git diff --staged --quiet; then
            echo "PDF 冇變，唔使 commit"
          else
            git commit -m "自動更新字卡 PDF [skip ci]"
            git push
            echo "PDF 已更新"
          fi

      - name: 另存一份 PDF 做 artifact
        uses: actions/upload-artifact@v4
        with:
          name: 字卡PDF
          path: |
            字卡.pdf
            pdf/
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發佈去 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
